[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sora-agent"
version = "0.1.0"
description = "A model-agnostic agent harness with human-approval and quality gates."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Tam Kuan Hou (譚君浩 / Marco Tam)" }]
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["sora_agent"]
