[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-scaffold"
version = "0.1.0"
description = "A minimal, model-agnostic agent harness with human-approval and quality gates."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Zhaowei Sun" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["agent_harness"]
